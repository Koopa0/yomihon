# A small vault for the smoke test and the browser behavior probes. The
# reading faces load this contract but do not validate notes against it, so
# most notes here exercise the faces without conforming to every required field.
# The lifecycle entries carry one real edge — draft to ready, owned by the
# human actor — so the lesson note renders a live seal form for the
# seal-select-guard probe without ever committing a transition.
schema_version = "1"
[enums]
type = ["concept", "lesson", "moc", "source-map", "study-path", "system", "topic-map"]
domain = ["golang", "japanese"]
source_kind = ["course"]
source_provider = ["example-provider"]
level = ["fundamental"]
map_kind = ["topic"]
[enums.status]
note = ["seedling", "ready"]
system = ["active"]
lesson = ["draft", "ready"]
[fields]
required = ["title", "type", "domain"]
required_inbox = ["title", "type"]
known = ["title", "type", "domain", "status", "based_on", "source_locator", "tags"]
lesson_only = ["slug"]
[fields.status_group]
system = ["system", "guide"]
lesson = ["lesson"]
[rules]
domain_equals_folder_under = ["Concepts"]
concept_requires_provenance = ["based_on", "source_locator"]
slug_pattern = "^[a-z0-9]+(-[a-z0-9]+)*$"
forbid_tag_with_slash = true
[scan]
knowledge_dirs = ["Concepts", "Sources"]
skip_basenames = ["README.md"]
[[lifecycle]]
status = "draft"
applies_to = ["lesson"]
from = []
owner = ["claude", "koopa"]

[[lifecycle]]
status = "ready"
applies_to = ["lesson"]
from = ["draft"]
owner = ["koopa"]
