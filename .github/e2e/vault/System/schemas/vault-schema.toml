# A small vault for the smoke test and the browser behavior probes. The
# reading faces load this contract but do not validate notes against it, so
# most notes here exercise the faces without conforming to every required field.
# Notes/out-of-contract.md deliberately uses type field-note, absent from the
# enum below, so live smoke locks fail-open reading independently of map types.
# The lifecycle entries carry one real edge — draft to ready — so the lesson
# note offers a live status control for the write-face probes. The home block
# counts the statuses notes actually carry: the seedling inbox note under
# Notes/ and the drafts give it a real distribution to show.
schema_version = "1"
[enums]
type = ["concept", "guide", "inbox", "lesson", "moc", "source-map", "study-path", "system", "topic-map"]
domain = ["golang", "japanese"]
source_kind = ["course"]
source_provider = ["example-provider"]
level = ["fundamental"]
map_kind = ["topic"]
[enums.status]
note = ["seedling", "ready"]
system = ["active"]
lesson = ["draft", "ready"]
[fields]
required = ["title", "type", "domain"]
required_inbox = ["title", "type"]
known = ["title", "type", "domain", "status", "based_on", "source_locator", "tags", "lang"]
lesson_only = ["slug"]
[fields.status_group]
system = ["system", "guide"]
lesson = ["lesson"]
[rules]
domain_equals_folder_under = ["Concepts"]
concept_requires_provenance = ["based_on", "source_locator"]
slug_pattern = "^[a-z0-9]+(-[a-z0-9]+)*$"
forbid_tag_with_slash = true
[scan]
knowledge_dirs = ["Concepts", "Sources", "Notes", "Maps", "Writing"]
skip_basenames = ["README.md"]

[navigation]
path_types = ["study-path"]
map_types = ["moc", "source-map", "topic-map"]

[artifacts]
non_instance_dirs = ["System/templates"]

[privacy]
# Diary/ is the one directory this fixture marks private (its note says so:
# "Private local fixture entry"). The sidebar and reading faces still show it
# — see .github/e2e/sidebar-content.mjs — because this policy withholds only
# the agent-facing check/report surface, never the pages a person reads.
never_egress_dirs = ["Diary"]

[[lifecycle]]
status = "draft"
applies_to = ["lesson"]
from = []
owner = ["claude", "koopa"]

[[lifecycle]]
status = "ready"
applies_to = ["lesson"]
from = ["draft"]
owner = ["koopa"]
