# A small vault for the smoke test and the browser behavior probes. The
# reading faces load this contract but do not validate notes against it, so
# most notes here exercise the faces without conforming to every field.
# Notes/out-of-contract.md deliberately uses type field-note, absent from the
# types below, so live smoke locks fail-open reading independently of map types.
# A note still being written carries draft: true, the flag the reading faces
# mark, so rows across the sidebar, the course and the reading rail carry the
# mark the layout probes measure beside a name. fields.common carries created
# so the reports shelf has a vault that dates a note by a declared field,
# beside one it dates by the filename and one with no day at all.
schema_version = "2"

[folders]
checked = ["Concepts", "Notes", "Maps", "Writing"]
templates = ["System/templates"]
journal = "Diary"
domain_from = ["Concepts"]
skipped_files = ["README.md"]

[enums]
domain = ["golang", "japanese"]

[fields]
common = ["type", "aliases", "lang", "created", "based_on"]
required = ["type"]

[types.concept]

[types.guide]

[types.inbox]

[types.lesson]
role = "lesson"
fields = ["slug"]
slug_pattern = '^[a-z0-9]+(-[a-z0-9]+)*$'

[types.moc]
role = "map"

[types.source-map]
role = "map"

[types.study-path]
role = "course"

[types.system]

[types.topic-map]
role = "map"

[rules]
concept_requires_provenance = ["based_on", "source_locator"]

[privacy]
# Diary/ is the one directory this fixture marks private (its note says so:
# "Private local fixture entry"). The sidebar and reading faces still show it
# — see .github/e2e/sidebar-content.mjs — because this policy withholds only
# the agent-facing check/report surface, never the pages a person reads.
never_egress_dirs = ["Diary"]
