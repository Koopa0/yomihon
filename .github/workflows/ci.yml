name: CI

# Gates every PR (and push to main) on yomihon's actual code: build, vet, lint,
# race-enabled tests, and a vulnerability scan. Deterministic — no agent or API
# dependency. Intended as a required check.

on:
  pull_request:
  push:
    branches: [main]
  # A tag push does not match branches: [main] above, so releasing from a tag
  # cannot depend on this workflow having already run there. workflow_call
  # lets the tag-triggered release workflow run this exact job graph against
  # the tagged commit, instead of a second copy of these jobs drifting from
  # this one.
  workflow_call:

permissions:
  contents: read

# A newer push to a pull request supersedes the run in flight, so that run is
# cancelled. A push to main is a merge, and main's own run is the only proof
# that the merged tree is green: a required check on a pull request ran
# against the base that branch had, not the one it lands on. So a run on main
# is left to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The stylesheet generator and the Go linter are pinned by version and by
# checksum, so a version bump surfaces as an intentional change here rather
# than as silent tool drift, and the exact bytes are verified before either
# binary runs. Each checksum matches the Linux x86_64 artifact published with
# that release.
env:
  TAILWIND_VERSION: v4.1.17
  TAILWIND_SHA256: cc115d9b6c4ede4e423bfea6a3cfc3f03e6c1702b7d910369b9540e2b4cf3860
  GOLANGCI_LINT_VERSION: v2.13.2
  GOLANGCI_LINT_SHA256: 2277d43b98ec0054280f2ac26b53268bae97682444678a59a657dd565da021d6
  GOSEC_VERSION: v2.28.0
  STATICCHECK_VERSION: v0.8.1
  ACTIONLINT_VERSION: v1.7.12
  GOVULNCHECK_VERSION: v1.5.0
  DEADCODE_VERSION: v0.49.0
  BENCHSTAT_VERSION: v0.0.0-20260709024250-82a0b07e230d
  SHELLCHECK_VERSION: v0.11.0
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
  NODE_VERSION: 22.23.1

jobs:
  # Mirrors the local gate: build, vet, lint, and race-enabled tests in the
  # same order a developer runs before pushing. Every Linux verification
  # behavior runs once here — not again in a sibling job. The summary step
  # below groups what passed for at-a-glance review.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: .github/package-lock.json

      - name: Install pinned Go analysis and generation tools
        run: |
          go install "github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}"
          go install "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}"
          go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          go install "golang.org/x/tools/cmd/deadcode@${DEADCODE_VERSION}"
          go install "golang.org/x/perf/cmd/benchstat@${BENCHSTAT_VERSION}"

      - name: Install golangci-lint v2 (pinned)
        run: |
          curl -sSfL "https://github.com/golangci/golangci-lint/releases/download/${GOLANGCI_LINT_VERSION}/golangci-lint-${GOLANGCI_LINT_VERSION#v}-linux-amd64.tar.gz" -o "${RUNNER_TEMP}/golangci-lint.tar.gz"
          echo "${GOLANGCI_LINT_SHA256}  ${RUNNER_TEMP}/golangci-lint.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/golangci-lint.tar.gz" -C "${RUNNER_TEMP}"
          install -D "${RUNNER_TEMP}/golangci-lint-${GOLANGCI_LINT_VERSION#v}-linux-amd64/golangci-lint" "$(go env GOPATH)/bin/golangci-lint"

      - name: Install ShellCheck (pinned)
        run: |
          curl -sSfL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" -o "${RUNNER_TEMP}/shellcheck.tar.xz"
          echo "${SHELLCHECK_SHA256}  ${RUNNER_TEMP}/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "${RUNNER_TEMP}/shellcheck.tar.xz" -C "${RUNNER_TEMP}"
          install -D "${RUNNER_TEMP}/shellcheck-${SHELLCHECK_VERSION}/shellcheck" "$(go env GOPATH)/bin/shellcheck"

      - name: Install Tailwind CSS (pinned)
        run: |
          curl -sSfL "https://github.com/tailwindlabs/tailwindcss/releases/download/${TAILWIND_VERSION}/tailwindcss-linux-x64" -o "${RUNNER_TEMP}/tailwindcss"
          echo "${TAILWIND_SHA256}  ${RUNNER_TEMP}/tailwindcss" | sha256sum -c -
          chmod +x "${RUNNER_TEMP}/tailwindcss"
          install -D "${RUNNER_TEMP}/tailwindcss" "$(go env GOPATH)/bin/tailwindcss"

      - name: Verify
        run: make verify

      - name: Record what verify exercised
        if: success()
        run: |
          {
            echo '## Gates executed once via make verify'
            echo
            echo 'Each Linux verification behavior ran exactly once in this job.'
            echo
            echo '| Group | Prerequisites |'
            echo '| --- | --- |'
            echo '| Hygiene | tracked-paths-check, mod-check, fmt-check, css-check |'
            echo '| Static analysis | vet, lint, staticcheck, gosec, workflow-check |'
            echo '| Tests and conventions | test, convention-check, real-vault-build-check, build-check |'
            echo '| Frontend | frontend-check |'
            echo '| Fixtures | check-fixtures |'
            echo '| HTTP contract | e2e-http-check |'
            echo '| Fuzz and benchmarks | fuzz-smoke, performance-smoke |'
            echo '| Browser behavior | browser-check |'
            echo '| Mutation probes | mutation-check |'
            echo '| Portable cross-build | portable-build-check |'
            echo '| Vulnerability scan | vuln |'
          } >> "${GITHUB_STEP_SUMMARY}"

  # Records coverage as review evidence without inventing a percentage that can
  # be gamed by low-value assertions. The race, fuzz, browser, golden, and
  # mutation gates remain the behavioral authority; this job makes blind spots
  # visible and retains the standard Go profile for local inspection.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Record Go coverage
        run: |
          make coverage-report \
            COVER_PROFILE="${RUNNER_TEMP}/coverage.out" \
            COVER_SUMMARY="${RUNNER_TEMP}/coverage.txt"
          {
            echo '## Go coverage'
            echo
            echo '```text'
            tail -n 1 "${RUNNER_TEMP}/coverage.txt"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Retain the coverage profile and function summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-coverage
          path: |
            ${{ runner.temp }}/coverage.out
            ${{ runner.temp }}/coverage.txt
          if-no-files-found: error
          retention-days: 14

  # The full analysis, generation, race, and fuzz gates run once on Linux. A
  # real Darwin runner also executes the complete suite. Windows builds and
  # vets every package, compiles every test, then drives its product-specific
  # contract: the lexical reader remains available while status publication
  # fails before filesystem access.
  # Supported-platform write tests are intentionally not executed on a kernel
  # where those features are unavailable; the focused runtime contract below
  # is stronger evidence than skipping inside hundreds of unrelated tests.
  portable-core:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build every package
        run: go build ./...

      - name: Vet every package
        run: go vet ./...

      # The platform-boundary files hide behind this tag, so plain vet never
      # reads them and the cross-builds compile no tests. The Make target has
      # run both since those files existed; this is the runner catching up.
      - name: Vet every package behind the durability tag
        run: go vet -tags yomihon_nodurable ./...

      - name: Race-test every package
        if: runner.os != 'Windows'
        run: go test -race ./... -count=1

      - name: Compile every test package on Windows
        if: runner.os == 'Windows'
        run: go test ./... -run '^$' -count=1

      # The boundary tests are asked for by name before they are run. A -run
      # pattern that matches nothing is not an error to Go and exits 0 without
      # testing anything, so a renamed test would quietly turn this contract
      # into a green no-op — the same loss the fuzz job guards against by
      # discovering its targets. Demanding at least one match is not enough:
      # the pattern spans two packages, and renaming one package's tests would
      # leave the step green behind the other package's. Every test the step
      # exists to run is therefore named here, and a rename reds it until the
      # name here follows. A test added later still runs under the pattern, so
      # the list is a floor rather than an inventory to keep exact.
      - name: Drive the Windows reader and status-write boundary
        if: runner.os == 'Windows'
        shell: bash
        run: |
          listed=$(go test ./... -run '^TestUnsupportedPlatform' -list '^TestUnsupportedPlatform')
          printf '%s\n' "$listed"
          for name in TestUnsupportedPlatformKeepsReaderOpenAndStatusWritesClosed \
                      TestUnsupportedPlatformClosesWriteFaceBeforeFilesystem \
                      TestUnsupportedPlatformPOSTIsAnUnchangedServiceRefusal; do
            printf '%s\n' "$listed" | grep -qx "$name" || { echo "$name is not among the listed tests; the boundary step would leave its contract unrun" >&2; exit 1; }
          done
          go test ./... -run '^TestUnsupportedPlatform' -count=1
