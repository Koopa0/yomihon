name: CI

# Gates every PR (and push to main) on yomihon's actual code: build, vet, lint,
# race-enabled tests, and a vulnerability scan. Deterministic — no agent or API
# dependency. Intended as a required check.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Only the newest run for a ref needs to finish; superseded runs are cancelled
# so a burst of pushes does not queue redundant work.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The stylesheet generator and the Go linter are pinned by version and by
# checksum, so a version bump surfaces as an intentional change here rather
# than as silent tool drift, and the exact bytes are verified before either
# binary runs. Each checksum matches the Linux x86-64 artifact published with
# that release.
env:
  TAILWIND_VERSION: v4.1.17
  TAILWIND_SHA256: cc115d9b6c4ede4e423bfea6a3cfc3f03e6c1702b7d910369b9540e2b4cf3860
  GOLANGCI_LINT_VERSION: v2.12.2
  GOLANGCI_LINT_SHA256: 8df580d2670fed8fa984aac0507099af8df275e665215f5c7a2ae3943893a553

jobs:
  # Mirrors the local gate: build, vet, lint, and race-enabled tests in the
  # same order a developer runs before pushing.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install golangci-lint v2 (pinned)
        run: |
          curl -sSfL "https://github.com/golangci/golangci-lint/releases/download/${GOLANGCI_LINT_VERSION}/golangci-lint-${GOLANGCI_LINT_VERSION#v}-linux-amd64.tar.gz" -o "${RUNNER_TEMP}/golangci-lint.tar.gz"
          echo "${GOLANGCI_LINT_SHA256}  ${RUNNER_TEMP}/golangci-lint.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/golangci-lint.tar.gz" -C "${RUNNER_TEMP}"
          install -D "${RUNNER_TEMP}/golangci-lint-${GOLANGCI_LINT_VERSION#v}-linux-amd64/golangci-lint" "$(go env GOPATH)/bin/golangci-lint"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Lint
        run: golangci-lint run

      - name: Test
        run: go test -race -count=1 -shuffle=on ./...

  # Scans the dependency and standard-library surface for known
  # vulnerabilities. Kept separate from the build-and-test gate so a new
  # advisory does not mask a genuine build or test regression, and either
  # result reads at a glance.
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install govulncheck (pinned)
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.5.0

      - name: Vulnerability scan
        run: govulncheck ./...

  # Regenerating the checked-in generated files must produce no change. A
  # difference means a generated file was edited by hand, or a source changed
  # without its output being regenerated with the pinned tools.
  assets-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Regenerate the templ output
        run: go tool templ generate

      # Add everything to the index first so the check also catches a newly
      # generated file, or one deleted from the tree; a plain diff only sees
      # edits to a file that is already tracked.
      - name: Fail if the generated Go is out of date
        run: |
          git add -A
          git diff --cached --exit-code

      - name: Fetch the pinned stylesheet generator
        run: |
          curl -sSfL "https://github.com/tailwindlabs/tailwindcss/releases/download/${TAILWIND_VERSION}/tailwindcss-linux-x64" -o "${RUNNER_TEMP}/tailwindcss"
          echo "${TAILWIND_SHA256}  ${RUNNER_TEMP}/tailwindcss" | sha256sum -c -
          chmod +x "${RUNNER_TEMP}/tailwindcss"

      - name: Regenerate the stylesheet
        run: |
          "${RUNNER_TEMP}/tailwindcss" -i assets/css/input.css -o assets/css/output.css --minify

      - name: Fail if the stylesheet is out of date
        run: git diff --exit-code -- assets/css/output.css

  # The runtime script and the hand-written stylesheet sources, linted with
  # pinned tools. Node lives only on the runner; the product build stays free of
  # it.
  lint-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the frontend linters
        run: npm install --no-save --no-package-lock @biomejs/biome@2.5.2 stylelint@17.14.0 stylelint-config-recommended@18.0.0

      # biome.json turns off four rules where the runtime deliberately differs
      # from biome's defaults: explicit nil guards over optional chaining, a
      # couple of string concatenations, the cookie writes behind the theme and
      # furigana toggles, and the strict directive inside a classic script's
      # closure. Every other rule stays on, and a warning fails the job.
      - name: Lint the runtime script
        run: npx biome lint --error-on-warnings assets/js/yomihon.js

      # The stylesheet sources keep their own house style; the config holds on to
      # the correctness rules and allows the Tailwind theme at-rule.
      - name: Lint the stylesheet sources
        run: npx stylelint --config .stylelintrc.json assets/css/input.css assets/css/components.css assets/css/fonts.css assets/css/tokens.css

  # Builds the server, drives each reading face against a small fixture vault,
  # and checks the live listening socket is bound to loopback and nothing else.
  e2e-http:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the server
        run: go build -o "${RUNNER_TEMP}/yomihon" ./cmd/yomihon

      # A real server binds loopback, so the socket assertion below can only ever
      # come back green. This drives the same verdict over recorded listings that
      # widen the bind, and requires each to be refused — the lock's proof that
      # it is able to fail.
      - name: Prove the loopback socket assertion refuses a widened bind
        run: bash .github/e2e/smoke.sh --self-test

      - name: Drive the reading faces and check the listening socket
        run: bash .github/e2e/serve.sh "${RUNNER_TEMP}/yomihon" 19733 -- bash .github/e2e/smoke.sh

  # Runs a short live fuzz pass over each diagnostics target and smoke-runs the
  # benchmarks, so a crash or invariant break in the hand-rolled frontmatter and
  # link parsing surfaces on a pull request rather than in a later run. The seed
  # corpus already runs under race in the verify job; this job briefly explores
  # new inputs without it. Go takes one fuzz pattern per invocation, so the
  # targets are looped.
  #
  # The targets are asked for rather than written down. A pattern that matches no
  # target is not an error to Go: it prints "no fuzz tests to fuzz" and exits 0,
  # so a written-down name that a rename left behind would quietly fuzz nothing
  # and the job would stay green over the loss. Listing them means a renamed
  # target keeps being fuzzed and a new one is fuzzed the day it lands; the
  # warning is refused as well, so nothing can reach the end of a pass having
  # explored no inputs.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Fuzz each diagnostics target briefly
        run: |
          targets="$(go test ./internal/judge -run='^$' -list='^Fuzz' | grep '^Fuzz')"
          [ -n "$targets" ] || { echo "the diagnostics package names no fuzz targets" >&2; exit 1; }
          echo "fuzzing: $(echo "$targets" | tr '\n' ' ')"
          for t in $targets; do
            out="$(go test ./internal/judge -run='^$' -fuzz="^${t}\$" -fuzztime=30s 2>&1)" || { printf '%s\n' "$out"; exit 1; }
            printf '%s\n' "$out"
            case "$out" in
            *"no fuzz tests to fuzz"*)
              echo "the ${t} pattern explored no inputs" >&2
              exit 1
              ;;
            esac
          done

      - name: Smoke-run the benchmarks
        run: go test ./... -run='^$' -bench=. -benchtime=1x

  # Drives the runner's system Chrome (playwright-core, installed runner-only
  # like the frontend linters — no package.json, no downloaded browser, no
  # pixel comparison) against the fixture vault and locks live reading
  # behaviors that plain HTTP assertions cannot see: the command palette opens
  # centered and opaque; the sidebar filter is revealed by the document's own
  # inline script rather than the deferred one, and stays hidden with
  # JavaScript off; and a held R inside a focused select never starts the seal
  # hold, with the picker closed or open.
  e2e-behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the browser driver
        run: npm install --no-save --no-package-lock playwright-core@1.61.1

      - name: Build the server
        run: go build -o "${RUNNER_TEMP}/yomihon" ./cmd/yomihon

      - name: Run the behavior probes against the fixture vault
        run: bash .github/e2e/serve.sh "${RUNNER_TEMP}/yomihon" 19734 -- bash .github/e2e/probes.sh

  # Proves the probes above can fail. Each one names its own self-test modes;
  # every mode injects the regression that probe exists to catch, and the run is
  # required to exit 1 and print the marker naming the mode it caught. Exit 0
  # means the injected regression walked past the probe. Exit 2 means the
  # mutation's needle matched nothing — which is how a self-test that quietly
  # died against a rewritten source turns red here, on the day it dies, rather
  # than on the day someone next runs it by hand. That has already happened once:
  # a needle written against one branch no longer matched the script it landed
  # beside, and only a run by hand revealed it.
  e2e-mutations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the browser driver
        run: npm install --no-save --no-package-lock playwright-core@1.61.1

      - name: Build the server
        run: go build -o "${RUNNER_TEMP}/yomihon" ./cmd/yomihon

      - name: Prove every probe catches the regression it watches for
        run: bash .github/e2e/serve.sh "${RUNNER_TEMP}/yomihon" 19735 -- bash .github/e2e/probes.sh --mutate
