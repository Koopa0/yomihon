name: CI

# Gates every PR (and push to main) on yomihon's actual code: build, vet, lint,
# race-enabled tests, and a vulnerability scan. Deterministic — no agent or API
# dependency. Intended as a required check.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Only the newest run for a ref needs to finish; superseded runs are cancelled
# so a burst of pushes does not queue redundant work.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The stylesheet generator and the Go linter are pinned by version and by
# checksum, so a version bump surfaces as an intentional change here rather
# than as silent tool drift, and the exact bytes are verified before either
# binary runs. Each checksum matches the Linux x86-64 artifact published with
# that release.
env:
  TAILWIND_VERSION: v4.1.17
  TAILWIND_SHA256: cc115d9b6c4ede4e423bfea6a3cfc3f03e6c1702b7d910369b9540e2b4cf3860
  GOLANGCI_LINT_VERSION: v2.13.2
  GOLANGCI_LINT_SHA256: 2277d43b98ec0054280f2ac26b53268bae97682444678a59a657dd565da021d6
  GOSEC_VERSION: v2.28.0
  STATICCHECK_VERSION: v0.8.1
  ACTIONLINT_VERSION: v1.7.12
  GOVULNCHECK_VERSION: v1.5.0
  SHELLCHECK_VERSION: v0.11.0
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
  NODE_VERSION: 22.23.1

jobs:
  # Mirrors the local gate: build, vet, lint, and race-enabled tests in the
  # same order a developer runs before pushing.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: .github/package-lock.json

      - name: Install pinned Go analysis and generation tools
        run: |
          go install "github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}"
          go install "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}"
          go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"

      - name: Install golangci-lint v2 (pinned)
        run: |
          curl -sSfL "https://github.com/golangci/golangci-lint/releases/download/${GOLANGCI_LINT_VERSION}/golangci-lint-${GOLANGCI_LINT_VERSION#v}-linux-amd64.tar.gz" -o "${RUNNER_TEMP}/golangci-lint.tar.gz"
          echo "${GOLANGCI_LINT_SHA256}  ${RUNNER_TEMP}/golangci-lint.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/golangci-lint.tar.gz" -C "${RUNNER_TEMP}"
          install -D "${RUNNER_TEMP}/golangci-lint-${GOLANGCI_LINT_VERSION#v}-linux-amd64/golangci-lint" "$(go env GOPATH)/bin/golangci-lint"

      - name: Install ShellCheck (pinned)
        run: |
          curl -sSfL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" -o "${RUNNER_TEMP}/shellcheck.tar.xz"
          echo "${SHELLCHECK_SHA256}  ${RUNNER_TEMP}/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "${RUNNER_TEMP}/shellcheck.tar.xz" -C "${RUNNER_TEMP}"
          install -D "${RUNNER_TEMP}/shellcheck-${SHELLCHECK_VERSION}/shellcheck" "$(go env GOPATH)/bin/shellcheck"

      - name: Install Tailwind CSS (pinned)
        run: |
          curl -sSfL "https://github.com/tailwindlabs/tailwindcss/releases/download/${TAILWIND_VERSION}/tailwindcss-linux-x64" -o "${RUNNER_TEMP}/tailwindcss"
          echo "${TAILWIND_SHA256}  ${RUNNER_TEMP}/tailwindcss" | sha256sum -c -
          chmod +x "${RUNNER_TEMP}/tailwindcss"
          install -D "${RUNNER_TEMP}/tailwindcss" "$(go env GOPATH)/bin/tailwindcss"

      - name: Verify
        run: make verify

  # Scans the dependency and standard-library surface for known
  # vulnerabilities. Kept separate from the build-and-test gate so a new
  # advisory does not mask a genuine build or test regression, and either
  # result reads at a glance.
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install govulncheck (pinned)
        run: go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"

      - name: Vulnerability scan
        run: make vuln

  # Records coverage as review evidence without inventing a percentage that can
  # be gamed by low-value assertions. The race, fuzz, browser, golden, and
  # mutation gates remain the behavioral authority; this job makes blind spots
  # visible and retains the standard Go profile for local inspection.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Record Go coverage
        run: |
          make coverage-report \
            COVER_PROFILE="${RUNNER_TEMP}/coverage.out" \
            COVER_SUMMARY="${RUNNER_TEMP}/coverage.txt"
          {
            echo '## Go coverage'
            echo
            echo '```text'
            tail -n 1 "${RUNNER_TEMP}/coverage.txt"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Retain the coverage profile and function summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-coverage
          path: |
            ${{ runner.temp }}/coverage.out
            ${{ runner.temp }}/coverage.txt
          if-no-files-found: error
          retention-days: 14

  # The full analysis, generation, race, and fuzz gates run once on Linux. A
  # real Darwin runner also executes the complete suite. Windows builds and
  # vets every package, compiles every test, then drives its product-specific
  # contract: the lexical reader remains available while status publication
  # fails before filesystem access.
  # Supported-platform write tests are intentionally not executed on a kernel
  # where those features are unavailable; the focused runtime contract below
  # is stronger evidence than skipping inside hundreds of unrelated tests.
  portable-core:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build every package
        run: go build ./...

      - name: Vet every package
        run: go vet ./...

      - name: Race-test every package
        if: runner.os != 'Windows'
        run: go test -race ./... -count=1

      - name: Compile every test package on Windows
        if: runner.os == 'Windows'
        run: go test ./... -run '^$' -count=1

      # The boundary tests are asked for by name before they are run. A -run
      # pattern that matches nothing is not an error to Go and exits 0 without
      # testing anything, so a renamed test would quietly turn this contract
      # into a green no-op — the same loss the fuzz job guards against by
      # discovering its targets. Demanding at least one match is not enough:
      # the pattern spans two packages, and renaming one package's tests would
      # leave the step green behind the other package's. Every test the step
      # exists to run is therefore named here, and a rename reds it until the
      # name here follows. A test added later still runs under the pattern, so
      # the list is a floor rather than an inventory to keep exact.
      - name: Drive the Windows reader and status-write boundary
        if: runner.os == 'Windows'
        shell: bash
        run: |
          listed=$(go test ./... -run '^TestUnsupportedPlatform' -list '^TestUnsupportedPlatform')
          printf '%s\n' "$listed"
          for name in TestUnsupportedPlatformKeepsReaderOpenAndStatusWritesClosed \
                      TestUnsupportedPlatformClosesWriteFaceBeforeFilesystem \
                      TestUnsupportedPlatformPOSTIsAnUnchangedServiceRefusal; do
            printf '%s\n' "$listed" | grep -qx "$name" || { echo "$name is not among the listed tests; the boundary step would leave its contract unrun" >&2; exit 1; }
          done
          go test ./... -run '^TestUnsupportedPlatform' -count=1



  # Regenerating the checked-in generated files must produce no change. A
  # difference means a generated file was edited by hand, or a source changed
  # without its output being regenerated with the pinned tools.
  assets-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Regenerate the templ output
        run: go tool templ generate -path internal/ui

      # Add everything to the index first so the check also catches a newly
      # generated file, or one deleted from the tree; a plain diff only sees
      # edits to a file that is already tracked.
      - name: Fail if the generated Go is out of date
        run: |
          git add -A
          git diff --cached --exit-code

      - name: Fetch the pinned stylesheet generator
        run: |
          curl -sSfL "https://github.com/tailwindlabs/tailwindcss/releases/download/${TAILWIND_VERSION}/tailwindcss-linux-x64" -o "${RUNNER_TEMP}/tailwindcss"
          echo "${TAILWIND_SHA256}  ${RUNNER_TEMP}/tailwindcss" | sha256sum -c -
          chmod +x "${RUNNER_TEMP}/tailwindcss"

      - name: Regenerate the stylesheet
        run: |
          "${RUNNER_TEMP}/tailwindcss" -i assets/css/input.css -o assets/css/output.css --minify

      - name: Fail if the stylesheet is out of date
        run: git diff --exit-code -- assets/css/output.css

  # The runtime script and the hand-written stylesheet sources, linted with
  # pinned tools. Node lives only on the runner; the product build stays free of
  # it.
  lint-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: .github/package-lock.json

      - name: Install the frontend linters
        run: npm ci --prefix .github --ignore-scripts --no-audit --fund=false

      # biome.json turns off four rules where the runtime deliberately differs
      # from biome's defaults: explicit nil guards over optional chaining, a
      # couple of string concatenations, and the cookie writes behind the theme
      # and furigana toggles. Every other rule stays on, and a warning fails the
      # job.
      - name: Lint the runtime and browser-probe scripts
        run: npm exec --prefix .github -- biome lint --error-on-warnings assets/js/*.js .github/e2e/*.mjs .github/*.mjs

      # The stylesheet sources keep their own house style; the config holds on to
      # the correctness rules and allows the Tailwind theme at-rule. The Make
      # target owns deterministic source discovery, including future additions.
      - name: Lint the stylesheet sources
        run: make stylelint-check

  # Builds the server, drives each reading face against a small fixture vault,
  # and checks the live listening socket is bound to loopback and nothing else.
  e2e-http:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Drive the HTTP and loopback contract
        run: make e2e-http-check

  # Runs a fixed-work fuzz pass over every target in the module and smoke-runs
  # the benchmarks, so a crash or invariant break at any raw-byte boundary
  # surfaces on a pull request rather than in a later run. The seed corpus
  # already runs under race in the verify job; this job explores 10,000 inputs
  # per target without it. Go takes one fuzz pattern per invocation, so the
  # targets are looped with a fixed per-target execution budget.
  #
  # The targets are asked for rather than written down. A pattern that matches
  # no target is not an error to Go and may exit 0 without exploring anything,
  # so a written-down name that a rename left behind would quietly fuzz nothing
  # and the job would stay green over the loss. Listing them means a renamed
  # target keeps being fuzzed and a new one is fuzzed the day it lands. The
  # older toolchain warning is refused too when present.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Discover and fuzz every target for 10,000 executions
        run: make fuzz-smoke

      - name: Smoke-run the benchmarks
        run: make performance-smoke

  # Drives the runner's system Chrome with the locked playwright-core package
  # (no downloaded browser and no pixel comparison) against the fixture vault
  # and locks live reading
  # behaviors that plain HTTP assertions cannot see: Home starts at the top and
  # stays a plain GET form; /search and ⌘K debounce input without weakening
  # native GET; the command palette opens centered and opaque; the sidebar filter is revealed
  # by the document's own inline script rather than the deferred one, and stays
  # hidden with JavaScript off; and content-derived Paths, Maps, and Journal
  # preserve grouping and wayfinding.
  e2e-behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: .github/package-lock.json

      - name: Install the browser driver
        run: npm ci --prefix .github --ignore-scripts --no-audit --fund=false

      - name: Record the browser build
        run: google-chrome --version

      - name: Run the behavior probes against the fixture vault
        run: make browser-check

  # Proves the probes above can fail. Each one names its own self-test modes;
  # every mode injects the regression that probe exists to catch, and the run is
  # required to exit 1 and print the marker naming the mode it caught. Exit 0
  # means the injected regression walked past the probe. Exit 2 means the
  # mutation's needle matched nothing — which is how a self-test that quietly
  # died against a rewritten source turns red here, on the day it dies, rather
  # than on the day someone next runs it by hand. That has already happened once:
  # a needle written against one branch no longer matched the script it landed
  # beside, and only a run by hand revealed it.
  e2e-mutations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: .github/package-lock.json

      - name: Install the browser driver
        run: npm ci --prefix .github --ignore-scripts --no-audit --fund=false

      - name: Record the browser build
        run: google-chrome --version

      - name: Prove every probe catches the regression it watches for
        run: make mutation-check
