name: Release

# Builds and publishes a GitHub release when a version tag is pushed. The
# publish job depends on the complete CI gate, so a failing tagged build
# cannot publish its platform binaries as a GitHub release.
#
# The gate job calls ci.yml as a reusable workflow (see workflow_call there)
# instead of repeating its jobs here: ci.yml does not trigger on a tag push,
# so no run of it against the tagged commit exists yet for `needs` or
# `workflow_run` to depend on, and calling it is the only way to run its
# full job graph — a caller cannot select a subset of a reusable workflow's
# jobs — without a second copy of ten jobs drifting out of step with the
# original.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  gate:
    name: Gate
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and publish
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      # Provenance is signed with a short-lived OIDC identity minted for this
      # run; `attestations: write` stores the signed statement alongside the
      # repository so `gh attestation verify` can check a downloaded binary
      # against the source and workflow that produced it.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Refuse release tags outside protected main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          tag_commit="$(git rev-parse --verify "$TAG^{commit}")"
          main_commit="$(git rev-parse --verify 'origin/main^{commit}')"
          printf 'tag: %s\npeeled commit: %s\nprotected main: %s\n' "$TAG" "$tag_commit" "$main_commit"
          if ! git merge-base --is-ancestor "$tag_commit" "$main_commit"; then
            printf 'refusing release: tag %s peels to %s, which is not reachable from protected origin/main %s\n' \
              "$TAG" "$tag_commit" "$main_commit" >&2
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # assets/css/output.css and the templ-generated Go under internal/ui
      # are committed source, kept current by the gate job's assets-drift
      # check, so building the released binary needs no generation step
      # here — only the four published platforms, cross-compiled without
      # cgo the same way `make portable-build-check` already does.
      - name: Cross-build the published platforms
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist

          targets=(darwin/arm64 darwin/amd64 linux/amd64 windows/amd64)
          for target in "${targets[@]}"; do
            goos=${target%/*}
            goarch=${target#*/}
            ext=""
            if [ "$goos" = "windows" ]; then
              ext=".exe"
            fi
            out="dist/yomihon_${TAG}_${goos}_${goarch}${ext}"
            echo "building $out"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -o "$out" ./cmd/yomihon
          done

          ( cd dist && sha256sum -- * > SHA256SUMS )

      # The attestation covers the four published binaries. SHA256SUMS is
      # derived from them and is not attested separately: a reader who
      # verifies a binary's provenance has already established the bytes,
      # and one who only checks the sums is trusting the same release page
      # that served them.
      - name: Attest the published binaries
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/yomihon_*

      # A tag such as v1.0.0-rc1 marks a pre-release; a plain v1.0.0 does
      # not. --verify-tag requires the tag to exist on the remote before
      # publication; it does not compare the tag's target with this checkout.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prerelease_flag=()
          case "$TAG" in
            *-*) prerelease_flag=(--prerelease) ;;
          esac
          gh release create "$TAG" dist/* --generate-notes --verify-tag "${prerelease_flag[@]}"
