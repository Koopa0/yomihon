name: Reading thoughts acceptance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOMAXPROCS: '2'
  GOFLAGS: -p=2
  NODE_VERSION: 22.23.1
  TAILWIND_VERSION: v4.1.17
  TAILWIND_SHA256: cc115d9b6c4ede4e423bfea6a3cfc3f03e6c1702b7d910369b9540e2b4cf3860

jobs:
  reading-thoughts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: .github/package-lock.json
      - name: Install pinned frontend tools
        run: |
          npm ci --prefix .github
          curl -sSfL "https://github.com/tailwindlabs/tailwindcss/releases/download/${TAILWIND_VERSION}/tailwindcss-linux-x64" -o "${RUNNER_TEMP}/tailwindcss"
          echo "${TAILWIND_SHA256}  ${RUNNER_TEMP}/tailwindcss" | sha256sum -c -
          chmod +x "${RUNNER_TEMP}/tailwindcss"
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"
      - name: Install CJK screenshot fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Generate and build the production application
        run: |
          make gen css
          go build -o "${RUNNER_TEMP}/yomihon-reading-thoughts" ./cmd/yomihon
          google-chrome --version
      - name: Prove focused Go assertions detect production regressions
        run: python3 tools/thought-mutations.py --output-dir "${RUNNER_TEMP}/thought-mutations"
      - name: Drive reading tasks in installed Chrome
        run: |
          set -o pipefail
          bash tools/reading-thoughts.sh "${RUNNER_TEMP}/yomihon-reading-thoughts" 2>&1 | tee "${RUNNER_TEMP}/reading-thoughts.log"
      - name: Prove open-thought shelf production regressions
        run: python3 tools/open-thoughts-mutations.py --output-dir "${RUNNER_TEMP}/open-thoughts-mutations"
      - name: Drive open-thought shelf tasks in installed Chrome
        run: |
          set -o pipefail
          bash tools/open-thoughts.sh "${RUNNER_TEMP}/yomihon-reading-thoughts" 2>&1 | tee "${RUNNER_TEMP}/open-thoughts.log"
      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reading-thoughts-evidence
          path: |
            ${{ runner.temp }}/reading-thoughts.log
            ${{ runner.temp }}/thought-mutations/
            ${{ runner.temp }}/open-thoughts.log
            ${{ runner.temp }}/open-thoughts-mutations/
            ${{ runner.temp }}/open-thoughts-screenshots/
