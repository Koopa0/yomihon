version: "2"
sql:
  - engine: "sqlite"
    queries: "internal/search/semantic/sql/query.sql"
    schema: "internal/search/semantic/sql/schema.sql"
    gen:
      go:
        package: "catalog"
        out: "internal/search/semantic/catalog"
        sql_package: "database/sql"
        emit_empty_slices: true
        emit_result_struct_pointers: false
        emit_params_struct_pointers: false
