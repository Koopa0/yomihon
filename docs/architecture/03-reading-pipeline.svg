<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1030" viewBox="0 0 1600 1030" role="img" aria-labelledby="title description">
<title id="title">Reading pipeline</title><desc id="description">Captured note bodies and the generation resolver feed a bounded Markdown pipeline. The output combines HTML, headings and diagnostics with the reading interface.</desc>
