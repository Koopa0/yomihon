<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="970" viewBox="0 0 1600 970" role="img" aria-labelledby="title description">
<title id="title">Reading generations</title><desc id="description">Scans capture files and build complete derived generations. Incomplete reads retry before degraded publication. Each request captures a published generation.</desc>
