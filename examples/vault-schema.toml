# Starting point for a new vault contract.
#
# Copy this file to System/schemas/vault-schema.toml inside your vault, then
# deliberately adapt every directory, enum, privacy boundary, and transition
# to that vault. Yomihon reads this contract but never creates or edits it.

schema_version = "1"

[enums]
type = ["note", "lesson", "study-path", "moc"]

[enums.status]
note = ["draft", "ready", "archived"]
lesson = ["draft", "ready", "archived"]

[fields]
required = ["title", "type", "status"]
known = ["title", "aliases", "type", "status", "created", "updated"]
lesson_only = ["slug"]

[fields.status_group]
lesson = ["lesson"]

[rules]
slug_pattern = "^[a-z0-9]+(-[a-z0-9]+)*$"
# One type name is coupled to a rule, in two steps. Name a type "concept" in
# the enum above and this key becomes required, listing the frontmatter fields
# a concept note must cite its source through — and every field it names has to
# be listed in fields.known as well, or the contract is rejected a second time
# for the field rather than for the rule. All three edits go together:
#
#   [enums]  type = [..., "concept"]
#   [fields] known = [..., "based_on", "source_locator"]
#   [rules]  concept_requires_provenance = ["based_on", "source_locator"]
#
# Miss any of them and the whole contract fails to load, which closes the write
# face and stops the agent-facing commands. They will not print the reason,
# because it quotes the contract: run "yomihon serve --root <dir>" and read the
# cause on the page or in the startup log.
# concept_requires_provenance = ["based_on", "source_locator"]

[scan]
knowledge_dirs = ["Notes", "Lessons"]
skip_basenames = ["README.md"]
# Leave this key out and yomihon does not rule on files carrying no frontmatter
# block. Write false and every note in a knowledge directory that carries none
# is reported as a fault.
no_frontmatter_is_legal = true

[navigation]
path_types = ["study-path"]
map_types = ["moc"]

[artifacts]
non_instance_dirs = ["System/templates"]

[privacy]
# Replace this example with every top-level directory whose content must never
# influence or enter agent output or embedding-provider egress.
never_egress_dirs = ["Private"]

# Owner lists are declarative data: they gate nothing, and any name works.
# They record, for your own agents' doctrine, who a status's onward step
# belongs to; yomihon parses and tolerates them without reading them.
[[lifecycle]]
status = "draft"
applies_to = ["*"]
from = []
owner = ["koopa"]

[[lifecycle]]
status = "ready"
applies_to = ["*"]
from = ["draft"]
owner = ["koopa"]

[[lifecycle]]
status = "archived"
applies_to = ["*"]
from = ["*"]
owner = ["koopa"]
