# The contract for this example vault, and a starting point for your own.
#
# Copy it to System/schemas/vault-schema.toml inside your vault, then adapt
# every folder, type, field list and privacy boundary deliberately: each one is
# a decision about your notes. yomihon reads this file and never writes it.
#
# A note writes no title and no domain. Its title is its first # heading, or
# its file name when it has none; its domain is the folder it sits in below a
# root named in folders.domain_from. A note says it is unfinished with
# draft: true, a field yomihon defines for every note, so no list below names
# it. Nothing records a note's progress beyond that flag: a note another one
# replaces is deleted, and its name goes into the replacement's aliases.

schema_version = "2"

[folders]
# The knowledge layer: `yomihon check` judges the notes under these
# directories. Diary and System are still read and served, and not judged.
checked = ["Concepts", "Inbox", "Lessons", "Maps", "Notes"]
# Shapes to copy rather than notes. A template is never listed as a lesson,
# a course, a map or a reader's thought.
templates = ["System/templates"]
journal = "Diary"
# A note's domain is the first folder below one of these: Concepts/go/ files
# its notes under go. Notes is left out on purpose, because its folders are
# grouped by language and by book rather than by subject, and a note directly
# under a root, such as Lessons/L01, has no domain.
domain_from = ["Concepts", "Lessons"]
# A README explains a folder to someone browsing the files; it is not a note.
skipped_files = ["README.md"]
# A plain Markdown file with no frontmatter is legal. Write false to have
# `yomihon check` report every note that carries no block.
frontmatter_optional = true

[enums]
# A domain is what a note is about. Keep the list short enough that every value
# is one you would really file under; a folder below a domain root that is not
# named here is reported against each note in it.
domain = ["yomihon", "japanese", "go"]
# How much a lesson assumes of its reader.
level = ["fundamental", "intermediate"]

[fields]
# The fields any note may write. The list is closed: a key that is not one of
# yomihon's fields given here or to the note's type is reported. type and
# draft are always allowed, as are Obsidian's own tags, aliases and cssclasses.
# lang declares one note's own BCP 47 language tag, e.g. "zh-Hant" or "ja"; a
# note that leaves it out has its content inherit the page's language.
# created is the day a note was made, which is also what dates a report.
common = ["type", "aliases", "lang", "created"]
required = ["type"]

# Every type a note may declare has a table here, in the order a reader meets
# them. A type with nothing to add needs only its name.
[types.note]
# A note that builds on another names it, the way a concept does.
fields = ["based_on"]

[types.lesson]
# A lesson is a member of a course. Its slug is its stable key, independent of
# the file's path, and the lesson role requires the field.
role = "lesson"
required = ["slug", "level"]
fields = ["slug", "level"]
slug_pattern = "^[a-z0-9]+(-[a-z0-9]+)*$"

[types.study-path]
# A course: an ordered study path over lessons.
role = "course"

[types.moc]
# A map of content: notes grouped for browsing, in no required order.
role = "map"

# A distilled idea. The name is what opens the concept sheets and the coverage
# report; rules.concept_requires_provenance says what it must cite.
[types.concept]

# A capture not yet filed, so it is not asked what it is about.
[types.inbox]

[types.thought]
# A reader's own source-linked thought. It is its own type so that an authored
# draft never sits on the shelf of what was left open beside what a reader
# wrote, and the thought role requires based_on.
role = "thought"
fields = ["based_on"]

[rules]
# A distilled idea says where it came from. A concept may write these fields
# without listing them.
concept_requires_provenance = ["based_on"]

[privacy]
# Nothing under a directory named here reaches yomihon's agent-facing output:
# check, coverage and exists leave those notes out of what they report. It does
# not bind the reading pages — a reader on this machine opens a note under
# Diary the way they open any other — so what it declares is what a program is
# told about the vault, not what the person at the keyboard can see. A
# directory left off the list is one that output may draw from, so naming it
# here is the whole protection.
never_egress_dirs = ["Diary"]
