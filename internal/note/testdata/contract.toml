# Loader fixture only — the runtime contract is the real vault's
# System/schemas/vault-schema.toml (wall 3). A lesson-only slice of the
# real shape, just enough to give handler_test.go a non-nil contract so the
# governed branches in handler.go's show() can actually be exercised
# (schema.LoadFile is reused as-is; this is not a second schema loader).
schema_version = "2"

[folders]
checked = ["Writing"]
templates = ["System/templates"]
skipped_files = ["README.md"]
frontmatter_optional = true

[enums]
domain = ["japanese"]

[fields]
common = ["type", "aliases", "draft", "lang", "created", "based_on"]
required = ["type", "created"]

[types.lesson]
role = "lesson"
fields = ["slug"]
slug_pattern = '^[a-z0-9]+(-[a-z0-9]+)*$'

[types.writing]
