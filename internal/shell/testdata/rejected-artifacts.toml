# Loader fixture for the shell projection: the same contract with a
# template directory that climbs out of the vault, so the artifact policy
# is rejected while the contract still loads.
schema_version = "2"

[folders]
checked = ["Writing"]
templates = ["../escape"]
skipped_files = ["README.md"]
frontmatter_optional = true

[enums]
domain = ["japanese"]

[fields]
common = ["type", "draft", "lang", "created"]
required = ["type", "created"]

[types.lesson]
role = "lesson"
fields = ["slug"]
slug_pattern = '^[a-z0-9]+(-[a-z0-9]+)*$'
