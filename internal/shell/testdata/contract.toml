# Loader fixture for the shell projection: one lesson type and a held
# artifact policy.
schema_version = "2"

[folders]
checked = ["Writing"]
templates = ["System/templates"]
skipped_files = ["README.md"]
frontmatter_optional = true

[enums]
domain = ["japanese"]

[fields]
common = ["type", "draft", "lang", "created"]
required = ["type", "created"]

[types.lesson]
role = "lesson"
fields = ["slug"]
slug_pattern = '^[a-z0-9]+(-[a-z0-9]+)*$'
