# Loader fixture only — the runtime contract is the real vault's
# System/schemas/vault-schema.toml (wall 3). Other packages' tests read this
# file and edit it by string replacement, so its lines keep their shape.
schema_version = "2"

[folders]
checked = ["Concepts", "Sources", "Maps", "Writing", "Synthesis", "Inbox"]
templates = ["System/templates"]
journal = "Diary"
domain_from = ["Concepts"]
skipped_files = ["README.md"]
frontmatter_optional = true

[enums]
domain = ["golang", "japanese", "meta"]
level = ["fundamental"]

[fields]
common = ["type", "aliases", "draft", "lang", "created", "based_on"]
required = ["type", "created"]

[types.inbox]
[types.concept]
[types.note]
[types.system]
[types.guide]
[types.template]
[types.writing]

[types.lesson]
role = "lesson"
fields = ["slug", "level"]
slug_pattern = '^[a-z0-9]+(-[a-z0-9]+)*$'

[types.study-path]
role = "course"

[types.moc]
role = "map"

[types.source-map]
role = "map"

[types.topic-map]
role = "map"

[types.thought]
role = "thought"
fields = ["based_on"]

[rules]
concept_requires_provenance = ["based_on", "source_locator"]
