schema_version = "2"

[folders]
checked = ["Concepts", "Sources"]
templates = ["System/templates"]
domain_from = ["Concepts"]
skipped_files = ["README.md"]

[enums]
domain = ["golang", "japanese"]
level = ["fundamental"]
prerequisites = ["topic"]
slug = ["fundamental-slug"]
verified_on = ["example-provider"]
verified_with = ["course"]

[fields]
common = ["type", "lang", "based_on"]
required = ["type"]

[types.inbox]

[types.concept]
fields = ["level", "prerequisites", "slug", "verified_on", "verified_with"]

[types.lesson]
role = "lesson"
fields = ["slug"]
slug_pattern = '^[a-z0-9]+(-[a-z0-9]+)*$'

[types.system]

[types.guide]

[rules]
concept_requires_provenance = ["based_on", "source_locator"]

[privacy]
never_egress_dirs = []
