schema_version = "1"
[enums]
type = ["concept", "lesson", "system"]
domain = ["golang", "japanese"]
source_kind = ["course"]
source_provider = ["example-provider"]
level = ["fundamental"]
map_kind = ["topic"]
[enums.status]
note = ["seedling", "ready"]
system = ["active"]
lesson = ["draft", "ready"]
[fields]
required = ["title", "type", "domain"]
required_inbox = ["title", "type"]
known = ["title", "type", "domain", "status", "source_kind", "source_provider", "level", "map_kind", "based_on", "source_locator", "tags"]
lesson_only = ["slug"]
[fields.status_group]
system = ["system", "guide"]
[rules]
domain_equals_folder_under = ["Concepts"]
concept_requires_provenance = ["based_on", "source_locator"]
slug_pattern = "^[a-z0-9]+(-[a-z0-9]+)*$"
forbid_tag_with_slash = true
[scan]
knowledge_dirs = ["Concepts", "Sources"]
skip_basenames = ["README.md"]
[[lifecycle]]
status = "seedling"
