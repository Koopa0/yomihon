schema_version = "2"

[folders]
checked = ["Concepts"]
templates = []
skipped_files = []

[enums]

[fields]
common = ["type", "aliases", "based_on"]
required = ["type"]

[types.concept]

[types.lesson]
role = "lesson"
fields = ["slug"]
slug_pattern = '^[a-z]+$'

[types.memo]

[rules]
concept_requires_provenance = ["based_on", "source_locator"]

[privacy]
never_egress_dirs = ["Private"]
