schema_version = "2"

[folders]
checked = ["Maps", "Writing"]
templates = ["System/templates"]
skipped_files = []

[enums]

[fields]
common = ["type", "lang"]
required = ["type"]

[types.lesson]
role = "lesson"
fields = ["slug"]
slug_pattern = '^[a-z]+$'

[types.course]
role = "cours"

[types.topic-map]
role = "map"

[types.concept]

[rules]
concept_requires_provenance = ["based_on"]

[privacy]
never_egress_dirs = []
