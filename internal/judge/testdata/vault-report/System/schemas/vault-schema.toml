schema_version = "2"

[folders]
checked = ["Concepts"]
templates = ["System/templates"]
domain_from = ["Concepts", "Writing/lessons"]
skipped_files = ["README.md"]

[enums]
domain = ["golang", "japanese"]

[fields]
common = ["type", "lang", "based_on"]
required = ["type"]

[types.inbox]

[types.concept]
fields = ["level"]

[types.lesson]
role = "lesson"
fields = ["slug"]
slug_pattern = '^[a-z0-9]+(-[a-z0-9]+)*$'

[types.system]

[types.guide]

[rules]
concept_requires_provenance = ["based_on", "source_locator"]

[privacy]
never_egress_dirs = []
